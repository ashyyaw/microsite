<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>@Andrea — Links</title>
  <meta name="description" content="All my links in one place." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --card-bg: rgba(255, 255, 255, 0.1);
      --card-border: rgba(190, 215, 255, 0.3);
      --text: #f4f8ff;
      --text-soft: rgba(222, 233, 255, 0.75);
      --radius: 16px;
      --ice: #dceaff;
      --navy-ink: #13245c;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: "Poppins", system-ui, sans-serif;
      min-height: 100vh;
      color: var(--text);
      background: linear-gradient(-45deg, #050817, #101a3e, #1c2c63, #33487f);
      background-size: 400% 400%;
      animation: gradientShift 24s ease infinite;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 48px 20px 120px;
    }

    @keyframes gradientShift {
      0%   { background-position: 0% 50%; }
      50%  { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Moon + starlight */
    #app { position: relative; z-index: 1; }

    body::before {
      content: "";
      position: fixed;
      top: 36px;
      right: 44px;
      width: 96px;
      height: 96px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #ffffff, #d6e4ff 55%, #aac6f7);
      box-shadow: 0 0 70px 28px rgba(185, 210, 255, 0.28);
      pointer-events: none;
      z-index: 0;
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background-image:
        radial-gradient(1.5px 1.5px at 12% 22%, rgba(255, 255, 255, 0.9), transparent 60%),
        radial-gradient(1.5px 1.5px at 78% 10%, rgba(255, 255, 255, 0.7), transparent 60%),
        radial-gradient(2px 2px at 34% 7%, rgba(255, 255, 255, 0.6), transparent 60%),
        radial-gradient(1.5px 1.5px at 55% 16%, rgba(255, 255, 255, 0.8), transparent 60%),
        radial-gradient(1.5px 1.5px at 88% 36%, rgba(255, 255, 255, 0.5), transparent 60%),
        radial-gradient(1.5px 1.5px at 8% 48%, rgba(255, 255, 255, 0.6), transparent 60%),
        radial-gradient(2px 2px at 68% 26%, rgba(255, 255, 255, 0.7), transparent 60%),
        radial-gradient(1.5px 1.5px at 44% 38%, rgba(255, 255, 255, 0.5), transparent 60%);
      animation: twinkle 5s ease-in-out infinite alternate;
    }

    @keyframes twinkle {
      from { opacity: 0.55; }
      to   { opacity: 1; }
    }

    .hidden { display: none !important; }

    /* ======= LOGIN (overlay) ======= */
    .login-screen {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(4, 7, 22, 0.55);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      padding: 20px;
    }

    .login-card {
      position: relative;
      width: 100%;
      max-width: 360px;
      padding: 36px 28px;
      border-radius: 20px;
      background: rgba(10, 16, 42, 0.85);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 10px 36px rgba(0, 0, 0, 0.35);
      text-align: center;
    }

    .login-card.shake { animation: shake 0.4s ease; }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-8px); }
      40% { transform: translateX(8px); }
      60% { transform: translateX(-5px); }
      80% { transform: translateX(5px); }
    }

    .login-close {
      position: absolute;
      top: 10px;
      right: 12px;
      background: none;
      border: none;
      color: var(--text-soft);
      font-size: 20px;
      cursor: pointer;
      line-height: 1;
      padding: 6px;
    }
    .login-close:hover { color: var(--text); }

    .login-card .lock {
      width: 56px;
      height: 56px;
      margin: 0 auto 18px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.18);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
    }

    .login-card h2 { font-size: 22px; font-weight: 800; }
    .login-card p  { font-size: 14px; color: var(--text-soft); margin: 6px 0 22px; }

    .login-card input {
      width: 100%;
      padding: 13px 16px;
      margin-bottom: 12px;
      border-radius: 12px;
      border: 1px solid var(--card-border);
      background: rgba(255, 255, 255, 0.12);
      color: var(--text);
      font-family: inherit;
      font-size: 15px;
      outline: none;
      transition: background 0.18s ease;
    }

    .login-card input::placeholder { color: rgba(255, 255, 255, 0.6); }

    .login-card input:focus {
      background: rgba(255, 255, 255, 0.16);
      border-color: rgba(190, 215, 255, 0.6);
    }

    .login-card button.submit {
      width: 100%;
      padding: 13px 16px;
      margin-top: 6px;
      border: none;
      border-radius: 12px;
      background: var(--ice);
      color: var(--navy-ink);
      font-family: inherit;
      font-size: 15.5px;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .login-card button.submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
    }

    .login-error {
      display: none;
      margin-top: 14px;
      font-size: 13.5px;
      font-weight: 600;
      color: #ffd7de;
      background: rgba(190, 24, 60, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 10px;
      padding: 9px 12px;
    }

    .login-error.visible { display: block; }

    /* ======= LINKTREE ======= */
    .profile {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-bottom: 36px;
    }

    .avatar {
      width: 108px;
      height: 108px;
      border-radius: 50%;
      border: 3px solid var(--card-border);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.25);
      object-fit: cover;
      background: rgba(255, 255, 255, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      font-weight: 800;
      margin-bottom: 16px;
      overflow: hidden;
    }

    .avatar img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; display: block; }

    .name {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: 0.5px;
    }

    .handle {
      font-size: 15px;
      font-weight: 500;
      color: var(--text-soft);
      margin-top: 2px;
    }

    .bio {
      font-size: 14.5px;
      color: var(--text-soft);
      margin-top: 10px;
      max-width: 340px;
      line-height: 1.55;
      white-space: pre-line;
    }

    .links {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .link {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px 20px;
      border-radius: var(--radius);
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: var(--text);
      text-decoration: none;
      font-weight: 600;
      font-size: 15.5px;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.12);
      transition: transform 0.18s ease, background 0.18s ease, box-shadow 0.18s ease;
    }

    a.link:hover {
      transform: translateY(-3px) scale(1.015);
      background: rgba(255, 255, 255, 0.24);
      box-shadow: 0 10px 26px rgba(0, 0, 0, 0.22);
    }

    a.link:active { transform: scale(0.985); }

    .link .icon {
      width: 34px;
      height: 34px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.18);
    }

    .link .icon svg { width: 20px; height: 20px; fill: currentColor; }

    .link .label {
      overflow-wrap: anywhere;
      text-align: left;
    }

    .link .arrow {
      margin-left: auto;
      opacity: 0.7;
      transition: transform 0.18s ease;
    }

    a.link:hover .arrow { transform: translateX(4px); }

    /* ======= EDIT MODE ======= */
    .link .controls {
      margin-left: auto;
      display: flex;
      gap: 6px;
    }

    .ctrl {
      width: 30px;
      height: 30px;
      border: none;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.2);
      color: var(--text);
      font-size: 14px;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s ease, transform 0.15s ease;
    }

    .ctrl:hover { background: rgba(255, 255, 255, 0.38); transform: scale(1.08); }
    .ctrl:disabled { opacity: 0.3; cursor: default; transform: none; }

    .add-link {
      padding: 15px 20px;
      border-radius: var(--radius);
      border: 2px dashed rgba(255, 255, 255, 0.45);
      background: transparent;
      color: var(--text);
      font-family: inherit;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .add-link:hover { background: rgba(255, 255, 255, 0.12); }

    .toolbar {
      position: fixed;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%);
      z-index: 40;
      display: none;
      gap: 8px;
      padding: 10px 12px;
      border-radius: 18px;
      background: rgba(10, 16, 42, 0.88);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
      max-width: calc(100vw - 24px);
      flex-wrap: wrap;
      justify-content: center;
    }

    body.editing .toolbar { display: flex; }

    .toolbar button {
      border: 1px solid var(--card-border);
      background: rgba(255, 255, 255, 0.14);
      color: var(--text);
      font-family: inherit;
      font-size: 13.5px;
      font-weight: 600;
      padding: 9px 13px;
      border-radius: 12px;
      cursor: pointer;
      transition: background 0.15s ease, transform 0.15s ease;
      white-space: nowrap;
    }

    .toolbar button:hover { background: rgba(255, 255, 255, 0.28); transform: translateY(-1px); }

    .toolbar button.primary { background: var(--ice); color: var(--navy-ink); border-color: transparent; }
    .toolbar button.primary:hover { background: #eaf3ff; }
    .toolbar button.danger { background: rgba(190, 24, 60, 0.45); }

    /* ======= MODALS ======= */
    .modal {
      position: fixed;
      inset: 0;
      z-index: 60;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(4, 7, 22, 0.6);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      padding: 20px;
    }

    .modal-card {
      position: relative;
      width: 100%;
      max-width: 400px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 28px 24px;
      border-radius: 20px;
      background: rgba(10, 16, 42, 0.92);
      border: 1px solid var(--card-border);
      box-shadow: 0 10px 36px rgba(0, 0, 0, 0.4);
    }

    .modal-card h3 { font-size: 19px; font-weight: 800; margin-bottom: 18px; }

    .modal-close {
      position: absolute;
      top: 10px;
      right: 12px;
      background: none;
      border: none;
      color: var(--text-soft);
      font-size: 20px;
      cursor: pointer;
      line-height: 1;
      padding: 6px;
    }
    .modal-close:hover { color: var(--text); }

    .field { margin-bottom: 14px; }

    .field label {
      display: block;
      font-size: 12.5px;
      font-weight: 600;
      color: var(--text-soft);
      margin-bottom: 6px;
      letter-spacing: 0.3px;
    }

    .field input,
    .field textarea {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid var(--card-border);
      background: rgba(255, 255, 255, 0.12);
      color: var(--text);
      font-family: inherit;
      font-size: 14.5px;
      outline: none;
      transition: background 0.18s ease;
    }

    .field textarea { resize: vertical; min-height: 72px; }

    .field input::placeholder,
    .field textarea::placeholder { color: rgba(255, 255, 255, 0.5); }

    .field input:focus,
    .field textarea:focus {
      background: rgba(255, 255, 255, 0.16);
      border-color: rgba(190, 215, 255, 0.6);
    }

    .field input[type="file"] { padding: 8px 10px; font-size: 13px; }
    .field input[type="file"]::file-selector-button {
      border: none;
      border-radius: 8px;
      background: var(--ice);
      color: var(--navy-ink);
      font-family: inherit;
      font-weight: 700;
      padding: 7px 12px;
      margin-right: 10px;
      cursor: pointer;
    }

    .modal-card .save-btn {
      width: 100%;
      padding: 13px 16px;
      margin-top: 6px;
      border: none;
      border-radius: 12px;
      background: var(--ice);
      color: var(--navy-ink);
      font-family: inherit;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .modal-card .save-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
    }

    .icon-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 8px;
      margin-top: 4px;
    }

    .icon-opt {
      width: 100%;
      aspect-ratio: 1;
      border-radius: 10px;
      border: 1.5px solid transparent;
      background: rgba(255, 255, 255, 0.12);
      color: var(--text);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s ease, border-color 0.15s ease;
    }

    .icon-opt:hover { background: rgba(255, 255, 255, 0.26); }

    .icon-opt.selected {
      border-color: #ffffff;
      background: rgba(255, 255, 255, 0.32);
    }

    .icon-opt svg { width: 18px; height: 18px; fill: currentColor; }

    /* ======= FOOTER / TOAST ======= */
    footer {
      margin-top: 40px;
      font-size: 13px;
      color: var(--text-soft);
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 6px;
      align-items: center;
    }

    .footer-actions { display: flex; gap: 14px; align-items: center; }

    .ghost-btn {
      background: none;
      border: none;
      color: var(--text);
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: underline;
      opacity: 0.85;
      padding: 0;
    }

    .ghost-btn:hover { opacity: 1; }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 84px;
      transform: translateX(-50%) translateY(8px);
      z-index: 70;
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid var(--card-border);
      color: var(--text);
      font-size: 13.5px;
      font-weight: 600;
      padding: 9px 16px;
      border-radius: 999px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease, transform 0.25s ease;
    }

    .toast.visible {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* ======= KUUHENKI MASCOT ======= */
    .mascot {
      position: fixed;
      left: 18px;
      bottom: 14px;
      z-index: 30;
      width: 76px;
      height: auto;
      cursor: pointer;
      filter: drop-shadow(0 8px 20px rgba(0, 0, 0, 0.5));
      animation: floaty 3.5s ease-in-out infinite;
      user-select: none;
      -webkit-user-drag: none;
    }

    .mascot:hover {
      animation-play-state: paused;
      scale: 1.12;
      rotate: -5deg;
    }

    @keyframes floaty {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-9px); }
    }

    .mascot-bubble {
      position: fixed;
      left: 104px;
      bottom: 56px;
      z-index: 30;
      max-width: 220px;
      background: rgba(10, 16, 42, 0.92);
      border: 1px solid var(--card-border);
      color: var(--text);
      font-size: 13px;
      font-weight: 600;
      line-height: 1.45;
      padding: 10px 14px;
      border-radius: 14px 14px 14px 4px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
      opacity: 0;
      transform: translateY(6px);
      transition: opacity 0.25s ease, transform 0.25s ease;
      pointer-events: none;
    }

    .mascot-bubble.visible {
      opacity: 1;
      transform: translateY(0);
    }

    @media (max-width: 480px) {
      .mascot { width: 56px; left: 10px; bottom: 10px; }
      .mascot-bubble { left: 12px; bottom: 76px; max-width: calc(100vw - 40px); }
    }

    @media (max-width: 480px) {
      body { padding-top: 36px; }
      .avatar { width: 92px; height: 92px; font-size: 34px; }
      .name { font-size: 22px; }
      .icon-grid { grid-template-columns: repeat(5, 1fr); }
    }
  </style>
</head>
<body>

  <!-- ======= LINKTREE PAGE ======= -->
  <div id="app">

    <header class="profile">
      <div class="avatar" id="avatar" aria-label="Avatar"></div>
      <h1 class="name" id="name"></h1>
      <p class="handle" id="handle"></p>
      <p class="bio" id="bio"></p>
    </header>

    <main class="links" id="links"></main>

    <footer>
      <div>Made with 🌙 · © <span id="year"></span> <span id="footer-name">Your Name</span></div>
      <div class="footer-actions">
        <button class="ghost-btn hidden" id="btn-edit" type="button">✏️ Edit page</button>
        <button class="ghost-btn hidden" id="btn-logout" type="button">Log out</button>
        <button class="ghost-btn hidden" id="btn-login" type="button">Log in to edit</button>
      </div>
    </footer>

  </div>

  <!-- ======= LOGIN OVERLAY ======= -->
  <div id="login" class="login-screen hidden">
    <form class="login-card" id="login-form" autocomplete="off">
      <button class="login-close" id="login-close" type="button" aria-label="Close">✕</button>
      <div class="lock">🔒</div>
      <h2>Owner login</h2>
      <p>Log in to add, edit and delete links</p>

      <input type="text" id="username" name="username" placeholder="Username" required autocomplete="username" />
      <input type="password" id="password" name="password" placeholder="Password" required autocomplete="current-password" />

      <button class="submit" type="submit">Log in</button>

      <div class="login-error" id="login-error">Wrong username or password. Try again.</div>
    </form>
  </div>

  <!-- ======= EDIT TOOLBAR ======= -->
  <div class="toolbar" id="toolbar">
    <button type="button" id="tb-add">➕ Add link</button>
    <button type="button" id="tb-profile">👤 Edit profile</button>
    <button type="button" id="tb-download">⬇ Download page</button>
    <button type="button" id="tb-reset" class="danger">↺ Reset</button>
    <button type="button" id="tb-done" class="primary">✓ Done</button>
  </div>

  <!-- ======= ADD/EDIT LINK MODAL ======= -->
  <div class="modal hidden" id="link-modal">
    <form class="modal-card" id="link-form">
      <button class="modal-close" type="button" data-close="link-modal" aria-label="Close">✕</button>
      <h3 id="link-modal-title">Add link</h3>

      <div class="field">
        <label for="link-title">Title</label>
        <input id="link-title" type="text" placeholder="e.g. My YouTube channel" required />
      </div>

      <div class="field">
        <label for="link-url">URL</label>
        <input id="link-url" type="text" placeholder="e.g. youtube.com/@yourname" required />
      </div>

      <div class="field">
        <label>Icon</label>
        <div class="icon-grid" id="icon-grid"></div>
      </div>

      <button class="save-btn" type="submit">Save link</button>
    </form>
  </div>

  <!-- ======= EDIT PROFILE MODAL ======= -->
  <div class="modal hidden" id="profile-modal">
    <form class="modal-card" id="profile-form">
      <button class="modal-close" type="button" data-close="profile-modal" aria-label="Close">✕</button>
      <h3>Edit profile</h3>

      <div class="field">
        <label for="profile-name">Name</label>
        <input id="profile-name" type="text" placeholder="Your Name" required />
      </div>

      <div class="field">
        <label for="profile-handle">Handle</label>
        <input id="profile-handle" type="text" placeholder="@yourname" />
      </div>

      <div class="field">
        <label for="profile-bio">Bio</label>
        <textarea id="profile-bio" placeholder="A short bio…"></textarea>
      </div>

      <div class="field">
        <label for="profile-avatar">Avatar image URL (leave empty to use initials)</label>
        <input id="profile-avatar" type="text" placeholder="https://…/photo.jpg" />
      </div>

      <div class="field">
        <label for="profile-avatar-file">…or upload a picture from your computer</label>
        <input id="profile-avatar-file" type="file" accept="image/*" />
      </div>

      <button class="save-btn" type="submit">Save profile</button>
    </form>
  </div>

  <!-- ======= KUUHENKI COMPANION ======= -->
  <img id="mascot" class="mascot" src="kuuhenki.png" alt="Kuuhenki" draggable="false" />
  <div class="mascot-bubble" id="mascot-bubble"></div>

  <div class="toast" id="toast"></div>

  <script>
    // ===================== CONFIG =====================
    // Owner credentials — ONLY this exact username + password can edit.
    // Client-side only, so it's a lock, not real security.
    var USERNAME = "Ash";
    var PASSWORD = "12345678";
    var AUTH_KEY = "microsite-auth";

    // The session stores a token derived from the correct credentials,

    function loadData() {

        if (saved) return JSON.parse(saved);
        // Migrate data from an older save slot instead of losing it

            return JSON.parse(old);
          }

      if (window.EMBEDDED_DATA) return JSON.parse(JSON.stringify(window.EMBEDDED_DATA));
      return JSON.parse(JSON.stringify(DEFAULT_DATA));
    }

    function saveData() {

    // ===================== HELPERS =====================
    function $(id) { return document.getElementById(id); }

    function normalizeUrl(u) {
      u = (u || "").trim();
      if (!u) return "#";
      if (/^(https?:|mailto:|tel:)/i.test(u)) return u;
      return "https://" + u;
    }

    function iconSvg(key) {
      return '<svg viewBox="0 0 24 24"><path d="' + (ICONS[key] || ICONS.link) + '"/></svg>';
    }

    function getInitials(name) {
      var parts = (name || "").trim().split(/\s+/).filter(Boolean);
      if (!parts.length) return "?";
      return parts.slice(0, 2).map(function (w) { return w[0].toUpperCase(); }).join("");
    }

    function toast(msg) {
      var t = $("toast");
      t.textContent = msg;

    // ===================== RENDER =====================

      renderFooter();

    function renderProfile() {
      var p = data.profile;
      var avatarEl = $("avatar");
      if (p.avatar) {
        avatarEl.innerHTML = "";
        var img = document.createElement("img");
        img.src = p.avatar;
        img.alt = "Avatar";
        img.onerror = function () { avatarEl.textContent = getInitials(p.name); };
        avatarEl.appendChild(img);
      } else {
        avatarEl.textContent = getInitials(p.name);
      }
      $("name").textContent = p.name;
      $("handle").textContent = p.handle;
      $("bio").textContent = p.bio;
      $("footer-name").textContent = p.name;
    }

    function renderLinks() {
      var container = $("links");
      container.innerHTML = "";

      data.links.forEach(function (link, i) {
        var row = document.createElement(editing ? "div" : "a");
        row.className = "link";

        if (!editing) {
          row.href = normalizeUrl(link.url);
          if (!/^mailto:/i.test(row.href)) {
            row.target = "_blank";
            row.rel = "noopener";
          }
        }

        var icon = document.createElement("span");
        icon.className = "icon";
        icon.innerHTML = iconSvg(link.icon);

        var label = document.createElement("span");
        label.className = "label";
        label.textContent = link.title;

        row.appendChild(icon);
        row.appendChild(label);

        if (editing) {
          var controls = document.createElement("span");
          controls.className = "controls";

          controls.appendChild(ctrlBtn("↑", "Move up", function () { moveLink(i, -1); }));
          controls.appendChild(ctrlBtn("↓", "Move down", function () { moveLink(i, 1); }));
          controls.appendChild(ctrlBtn("✎", "Edit", function () { openLinkModal(link.id); }));
          controls.appendChild(ctrlBtn("✕", "Delete", function () { deleteLink(link.id); }));

          controls.children[0].disabled = (i === 0);
          controls.children[1].disabled = (i === data.links.length - 1);

          row.appendChild(controls);
        } else {
          var arrow = document.createElement("span");
          arrow.className = "arrow";
          arrow.textContent = "→";
          row.appendChild(arrow);
        }

        container.appendChild(row);
      });

      if (editing) {
        var addBtn = document.createElement("button");
        addBtn.type = "button";
        addBtn.className = "add-link";
        addBtn.textContent = "➕ Add a new link";
        addBtn.addEventListener("click", function () { openLinkModal(null); });
        container.appendChild(addBtn);
      }
    }

    function ctrlBtn(glyph, title, onClick) {
      var b = document.createElement("button");
      b.type = "button";
      b.className = "ctrl";
      b.textContent = glyph;
      b.title = title;
      b.addEventListener("click", onClick);
      return b;
    }

    function renderFooter() {
      $("btn-edit").classList.toggle("hidden", !loggedIn);
      $("btn-logout").classList.toggle("hidden", !loggedIn);
      $("btn-login").classList.toggle("hidden", loggedIn);
    }

    // ===================== LINK ACTIONS =====================
    function moveLink(id, dir) {
      var i = data.links.findIndex(function (l) { return l.id === id; });
      var j = i + dir;
      if (i < 0 || j < 0 || j >= data.links.length) return;
      var tmp = data.links[i];
      data.links[i] = data.links[j];
      data.links[j] = tmp;
      saveData();
      renderLinks();
      toast("Saved ✓");
    }

    function deleteLink(id) {
      var link = data.links.find(function (l) { return l.id === id; });
      if (!link) return;
      if (!confirm('Delete "' + link.title + '"?')) return;
      data.links = data.links.filter(function (l) { return l.id !== id; });
      saveData();
      renderLinks();
      toast("Link deleted");
    }

    // ===================== LINK MODAL =====================
    function buildIconGrid() {
      var grid = $("icon-grid");
      grid.innerHTML = "";
      ICON_ORDER.forEach(function (key) {
        var b = document.createElement("button");
        b.type = "button";
        b.className = "icon-opt" + (key === currentIcon ? " selected" : "");
        b.title = key;
        b.innerHTML = iconSvg(key);
        b.addEventListener("click", function () {
          currentIcon = key;
          grid.querySelectorAll(".icon-opt").forEach(function (el) { el.classList.remove("selected"); });
          b.classList.add("selected");
        });
        grid.appendChild(b);
      });
    }

    function openLinkModal(id) {
      currentLinkId = id;
      var link = id ? data.links.find(function (l) { return l.id === id; }) : null;
      $("link-modal-title").textContent = link ? "Edit link" : "Add link";
      $("link-title").value = link ? link.title : "";
      $("link-url").value = link ? link.url : "";
      currentIcon = link ? link.icon : "link";
      buildIconGrid();
      $("link-modal").classList.remove("hidden");
      $("link-title").focus();
    }

    function closeModals() {
      $("link-modal").classList.add("hidden");
      $("profile-modal").classList.add("hidden");
    }

    $("link-form").addEventListener("submit", function (e) {
      e.preventDefault();
      var title = $("link-title").value.trim();
      var url = $("link-url").value.trim();
      if (!title || !url) return;

      if (currentLinkId) {
        var link = data.links.find(function (l) { return l.id === currentLinkId; });
        if (link) {
          link.title = title;
          link.url = url;
          link.icon = currentIcon;
        }
      } else {
        data.links.push({ id: Date.now(), title: title, url: url, icon: currentIcon });
      }

      saveData();
      closeModals();
      renderLinks();
      toast("Saved ✓");
    });

    // ===================== PROFILE MODAL =====================
    $("tb-profile").addEventListener("click", function () {
      $("profile-name").value = data.profile.name;
      $("profile-handle").value = data.profile.handle;
      $("profile-bio").value = data.profile.bio;
      $("profile-avatar").value = data.profile.avatar;
      $("profile-modal").classList.remove("hidden");
    });

    $("profile-form").addEventListener("submit", function (e) {
      e.preventDefault();
      data.profile.name = $("profile-name").value.trim() || "Your Name";
      data.profile.handle = $("profile-handle").value.trim();
      data.profile.bio = $("profile-bio").value;
      data.profile.avatar = $("profile-avatar").value.trim();
      saveData();
      closeModals();
      render();
      toast("Saved ✓");
    });

    // ===================== AVATAR UPLOAD =====================
    $("profile-avatar-file").addEventListener("change", function () {
      var file = this.files && this.files[0];
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function () {
        var img = new Image();
        img.onload = function () {
          // Center-crop to a 256px square so it fits neatly in the avatar circle
          var size = 256;
          var canvas = document.createElement("canvas");
          canvas.width = size;
          canvas.height = size;
          var ctx = canvas.getContext("2d");
          var min = Math.min(img.width, img.height);
          ctx.drawImage(img, (img.width - min) / 2, (img.height - min) / 2, min, min, 0, 0, size, size);
          $("profile-avatar").value = canvas.toDataURL("image/png");
          toast("Picture ready — now click Save profile");
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });

    // ===================== EDIT MODE =====================
    function startEditing() {
      editing = true;
      document.body.classList.add("editing");
      renderLinks();
    }

    function stopEditing() {
      editing = false;
      document.body.classList.remove("editing");
      renderLinks();
    }

    $("btn-edit").addEventListener("click", function () {

      render();
      toast("Reset to defaults");
    });

    // ===================== DOWNLOAD PAGE =====================
    $("tb-download").addEventListener("click", function () {
      saveData();
      var clone = document.documentElement.cloneNode(true);
      var lo = clone.querySelector("#login");
      if (lo) lo.classList.add("hidden");
      var old = clone.querySelector("#embedded-data");
      if (old) old.remove();
      var s = document.createElement("script");
      s.id = "embedded-data";
      s.textContent = "window.EMBEDDED_DATA = " + JSON.stringify(data) + ";";
      clone.querySelector("head").appendChild(s);

      var blob = new Blob(["<!DOCTYPE html>\n" + clone.outerHTML], { type: "text/html" });
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "microsite.html";
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
      toast("Page downloaded — share that file!");
    });

    // ===================== LOGIN =====================
    function openLogin() {
      $("login").classList.remove("hidden");
      $("login-error").classList.remove("visible");
      $("username").focus();
    }

    function closeLogin() {
      $("login").classList.add("hidden");
      $("login-form").reset();
    }

    $("btn-login").addEventListener("click", openLogin);
    $("login-close").addEventListener("click", closeLogin);

    $("login-form").addEventListener("submit", function (e) {
      e.preventDefault();
      var u = $("username").value.trim();
      var p = $("password").value;

      if (u === USERNAME && p === PASSWORD) {
        sessionStorage.setItem(AUTH_KEY, hashCreds(u, p));
        loggedIn = true;
        closeLogin();
        renderFooter();
        startEditing();
        toast("Welcome back, " + USERNAME + " 👋");
      } else {
        $("login-error").classList.add("visible");
        var card = $("login-form");
        card.classList.remove("shake");
        void card.offsetWidth;
        card.classList.add("shake");
      }
    });

    $("btn-logout").addEventListener("click", function () {
      sessionStorage.removeItem(AUTH_KEY);
      loggedIn = false;
      if (editing) stopEditing();
      renderFooter();
      toast("Logged out");
    });

    // ===================== KUUHENKI =====================
    var MASCOT_LINES = [
      "Hiii~ I'm Kuuhenki 🌙",
      "Welcome to Ash's links!",
      "The moon is beautiful tonight ✨",
      "Kuu~ have a lovely day!",
      "Psst… try clicking a link 👇",
      "Columbina says hi! 💙"
    ];

    var mascotEl = $("mascot");
    var bubbleEl = $("mascot-bubble");
    var bubbleTimer = null;

    mascotEl.addEventListener("click", function () {
      bubbleEl.textContent = MASCOT_LINES[Math.floor(Math.random() * MASCOT_LINES.length)];
      bubbleEl.classList.add("visible");
      clearTimeout(bubbleTimer);
      bubbleTimer = setTimeout(function () { bubbleEl.classList.remove("visible"); }, 2600);
    });

    // ===================== MISC =====================
    document.querySelectorAll("[data-close]").forEach(function (btn) {
      btn.addEventListener("click", closeModals);
    });

    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape") {
        closeModals();
        closeLogin();
      }
    });

    $("year").textContent = new Date().getFullYear();
    render();
  </script>

</body>
</html>
